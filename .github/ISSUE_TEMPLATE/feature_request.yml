name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Plain Planner aims to stay simple, so please focus on the problem you want to solve. Every idea is read, even if not every one can be added.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in your daily planning where something is missing or inconvenient.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: How could Plain Planner help? An example of the note before and after is very useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Other plugins, workarounds or settings you have considered.
